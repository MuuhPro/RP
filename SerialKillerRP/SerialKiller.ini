; ============================================================
;  SERIAL KILLER RP  -  configuracao
;  Troque as teclas e distancias aqui. NAO precisa recompilar.
;  Valores de tecla: NumPad0..NumPad9, F1..F12, letras (A,B,C...),
;  D0..D9 (numeros de cima), etc. (nomes do enum Keys do Windows)
; ============================================================

[Keys]
BagToggle=NumPad1
BagToTrunk=NumPad2
TieToggle=NumPad3
CarryToggle=NumPad4
VictimToTrunk=NumPad5
KnifeKill=NumPad6
DragToggle=NumPad7
DigToggle=NumPad8
PanicReset=NumPad9
MaskToggle=NumPad0
; Limpar vestigios (por padrao o ponto do teclado numerico "." = Decimal)
CleanEvidence=Decimal
; Esconde/mostra o menu de teclas E a barra de suspeita (numpad "-")
ToggleHud=Subtract

[Settings]
; Distancia (em metros) pra "pegar" um NPC
InteractDistance=2.5
; Distancia pra achar um carro / porta-mala perto de voce
VehicleDistance=3.5

; Prop do saco de lixo
BagModel=prop_rub_binbag_01

; Clipset de movimento pra andar segurando o saco.
; Se voce tiver uma animacao custom "_bag_walk_garbage_man" instalada,
; coloque o nome do clipset dela aqui.
BagClipset=anim@heists@box_carry@

; Prop da pa (numpad 8)
ShovelModel=prop_tool_shovel

; Mostrar a lista de teclas na tela (true/false)
ShowHelpUI=true

; Camera cinematica no momento da execucao com faca (Numpad 6). true/false
CinematicKill=true

; Notificacoes de texto ao fazer as acoes. false = tudo limpo (recomendado pra video)
ShowNotifications=false

[Offsets]
; ============================================================
;  AJUSTE FINO DE POSICAO (saco / carregar / arrastar)
;  Como estou sem poder testar no seu jogo, deixei tudo aqui.
;  DICA: edite os numeros, salve, e aperte INSERT no jogo pra
;  recarregar o mod na hora e ver o resultado na hora.
;  Off = posicao (metros)   Rot = rotacao (graus)
; ============================================================

; --- Saco de lixo na mao ---
; Se o saco ficar pra cima, mexa em BagRotX (tente 0, 90, 180, -90).
; Se ficar longe da mao, ajuste BagOffX/Y/Z aos poucos (0.05 por vez).
BagOffX=0.12
BagOffY=0.02
BagOffZ=-0.03
BagRotX=0
BagRotY=90
BagRotZ=0

; --- NPC carregado nas costas ---
; --- Corpo embrulhado carregado na mao (metodo LosSantosSerialKiller) ---
; Se ficar torto na mao, ajuste esses (Rot em graus).
CorpseOffX=-0.08
CorpseOffY=0.22
CorpseOffZ=-0.18
CorpseRotX=0
CorpseRotY=45
CorpseRotZ=90

; --- Corpo sendo arrastado ---
; Se o corpo afundar no chao, AUMENTE o DragOffZ (ex.: -0.5, -0.3).
; Se ficar muito alto/flutuando, DIMINUA (ex.: -0.9).
DragOffX=0.0
DragOffY=-0.85
DragOffZ=-0.55
DragRotX=0
DragRotY=90
DragRotZ=0

[Body]
; Prop do corpo embrulhado (metodo do LosSantosSerialKiller).
; prop_water_corpse_02 = corpo enrolado. Alternativas: prop_rub_binbag_01.
ModelName=prop_water_corpse_02
; Fade preto ao "embrulhar" (troca o ped vivo pelo corpo sem glitch). true/false
WrapFade=true

[Evidence]
; Barra de suspeita na tela (true/false)
ShowSuspicionBar=true

; Mascara (Numpad 0). O componente 1 do ped eh a regiao da mascara.
; O valor certo MUDA conforme o modelo de personagem:
;  - Em peds MP (mp_m_freemode_01 / mp_f_freemode_01) o drawable 1 sao as mascaras.
;  - Nos protagonistas (Michael/Franklin/Trevor) esse slot eh diferente; talvez
;    precise testar outro numero ou usar um ped custom pra ficar bom.
; Se a mascara nao aparecer, va aumentando o MaskDrawable (0,1,2,3...) e testando.
MaskDrawable=5
MaskTexture=0

; Quanto cada acao mexe no medidor de suspeita (0 a 100)
KillHeat=20
BuryHeat=15
CleanHeat=12
WitnessHeat=8
